<svg viewBox="0 0 500 500" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cream/Off-white Rounded Background Container -->
  <rect x="10" y="10" width="480" height="480" rx="95" fill="#FAF8F5" />
  
  <!-- Outer Thin Dark Blue Border -->
  <rect
    x="52"
    y="52"
    width="396"
    height="396"
    rx="76"
    fill="none"
    stroke="#0F2247"
    stroke-width="7"
  />

  <!-- Gold Food Dome (Cloche) with Handles -->
  <!-- Knob -->
  <circle cx="250" cy="136" r="15" fill="#DF9327" />
  <path d="M 242,148 L 258,148 L 255,160 L 245,160 Z" fill="#DF9327" />
  
  <!-- Dome Main Arc -->
  <path d="M 144,256 A 106,106 0 0,1 356,256 Z" fill="#DF9327" />
  
  <!-- Dome Base Plate -->
  <rect x="134" y="260" width="232" height="16" rx="8" fill="#DF9327" />

  <!-- Cutouts (Carved Fork and Knife overlayed with Cream background color) -->
  <!-- Fork Handle -->
  <rect x="225" y="218" width="6" height="50" rx="2" fill="#FAF8F5" />
  <!-- Fork Head -->
  <path
    d="M 225,218 C 223,205 215,202 215,180 L 215,174 L 241,174 L 241,180 C 241,202 233,205 231,218 Z"
    fill="#FAF8F5"
  />
  <!-- Fork Tine Slots -->
  <rect x="220" y="174" width="3.2" height="24" rx="1" fill="#DF9327" />
  <rect x="226.5" y="174" width="3.2" height="24" rx="1" fill="#DF9327" />
  <rect x="233" y="174" width="3.2" height="24" rx="1" fill="#DF9327" />

  <!-- Knife Handle -->
  <rect x="269" y="218" width="6" height="50" rx="2" fill="#FAF8F5" />
  <!-- Knife Blade -->
  <path
    d="M 269,218 L 275,218 L 275,174 C 275,174 260,180 260,198 C 260,208 266,212 269,218 Z"
    fill="#FAF8F5"
  />

  <!-- Elegant Serif Typography Below the Cloche -->
  <text
    x="250"
    y="336"
    font-family="Playfair Display, Georgia, serif"
    font-weight="bold"
    font-size="50"
    fill="#0F2247"
    text-anchor="middle"
    letter-spacing="4"
  >
    BARAA
  </text>
  <text
    x="250"
    y="376"
    font-family="Playfair Display, Georgia, serif"
    font-weight="bold"
    font-size="24"
    fill="#0F2247"
    text-anchor="middle"
    letter-spacing="2.5"
  >
    RESTAURANT
  </text>
</svg>
